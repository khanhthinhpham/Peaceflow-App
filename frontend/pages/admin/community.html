<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        if (!window.location.pathname.endsWith('/app.html')) {
            window.location.replace('app.html?page=' + window.location.pathname.split('/').pop());
        }
    </script>
    <title>Kiểm duyệt cộng đồng - Quản trị PeaceFlow</title>
    <link rel="stylesheet" href="../../public/css/style.css">
    <link rel="stylesheet" href="../../public/css/admin/admin.css">
</head>
<body class="admin-body">
    <main class="admin-main">
        <div class="admin-page-head" style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;">
            <div>
                <p class="admin-page-kicker">PeaceFlow Admin</p>
                <h1 class="admin-page-title">Kiểm duyệt cộng đồng</h1>
                <p class="admin-page-sub">Bài tự ẩn khi ≥ 5 báo cáo. Xem lại, ẩn/hiện, bỏ qua báo cáo hoặc gỡ bài.</p>
            </div>
            <button id="reloadBtn" class="btn-outline" type="button">
                <svg class="adm-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M20 11a8 8 0 1 0 2 5.3"></path>
                    <path d="M20 7v4h-4"></path>
                </svg>
                Tải lại
            </button>
        </div>

        <div class="admin-tabs" id="communityTabs">
            <button type="button" class="admin-tab active" data-filter="reported">Bị báo cáo</button>
            <button type="button" class="admin-tab" data-filter="hidden">Đã ẩn</button>
            <button type="button" class="admin-tab" data-filter="all">Tất cả</button>
        </div>

        <div id="adminCommunityMeta" style="font-size:.82rem;color:var(--text-light);margin-bottom:10px;"></div>
        <div id="adminCommunityList"></div>
        <div id="adminCommunityPager" class="admin-pager"></div>
    </main>
    <script type="module" src="../../public/js/admin/community-page.js"></script>
</body>
</html>
