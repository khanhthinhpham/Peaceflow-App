<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        if (!window.location.pathname.endsWith('/app.html')) {
            window.location.replace('app.html?page=' + window.location.pathname.split('/').pop());
        }
    </script>
    <title>Người dùng - Quản trị PeaceFlow</title>
    <link rel="stylesheet" href="../../public/css/style.css">
    <link rel="stylesheet" href="../../public/css/admin/admin.css">
</head>
<body class="admin-body">
    <main class="admin-main">
        <div class="admin-page-head">
            <p class="admin-page-kicker">PeaceFlow Admin</p>
            <h1 class="admin-page-title">Người dùng</h1>
            <p class="admin-page-sub">Tìm kiếm, khoá/mở tài khoản, đổi vai trò và xem số dư ví.</p>
        </div>

        <div class="admin-card" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
            <input id="userSearch" type="search" placeholder="Tìm theo email hoặc tên..." class="admin-input" style="flex:1;min-width:220px;">
            <select id="userRoleFilter" class="admin-input" aria-label="Lọc theo vai trò" title="Lọc theo vai trò" style="max-width:170px;">
                <option value="">Mọi vai trò</option>
                <option value="user">Người dùng</option>
                <option value="expert">Chuyên gia</option>
                <option value="admin">Quản trị</option>
            </select>
            <button id="userSearchBtn" type="button" class="btn-primary">Tìm</button>
        </div>

        <div class="admin-tabs" id="userStatusTabs">
            <button type="button" class="admin-tab active" data-status="">Tất cả</button>
            <button type="button" class="admin-tab" data-status="active">Hoạt động</button>
            <button type="button" class="admin-tab" data-status="suspended">Đã khoá</button>
        </div>

        <div id="adminUsersMeta" style="font-size:.82rem;color:var(--text-light);margin-bottom:10px;"></div>
        <div id="adminUsersList"></div>
        <div id="adminUsersPager" class="admin-pager"></div>
    </main>
    <script type="module" src="../../public/js/admin/users-page.js"></script>
</body>
</html>
