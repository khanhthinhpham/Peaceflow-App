# Build + KÝ app iOS bằng Distribution certificate + provisioning profile đã đăng ký trên
# Apple Developer Portal, xuất ra file .ipa đã ký sẵn sàng nộp App Store Connect — chạy trên
# macOS runner của GitHub Actions nên không cần máy Mac thật. Chạy thủ công (workflow_dispatch).
#
# Cần 4 repository secrets (Settings → Secrets and variables → Actions):
#   IOS_P12_BASE64                   — file .p12 (cert + private key) đã mã hoá base64
#   IOS_P12_PASSWORD                 — mật khẩu của file .p12
#   IOS_PROVISIONING_PROFILE_BASE64  — file .mobileprovision đã mã hoá base64
#   IOS_TEAM_ID                      — Team ID trên Apple Developer (vd H48B8C4PA3)
name: Build & Sign iOS (.ipa for App Store)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-vue/package-lock.json

      - name: Install frontend-vue dependencies
        working-directory: frontend-vue
        run: npm ci

      - name: Build web assets + sync Capacitor iOS project
        working-directory: frontend-vue
        run: npm run cap:sync

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app

      # Tạo 1 keychain tạm riêng cho job này (không đụng keychain mặc định của runner),
      # import cert .p12 vào đó, rồi cho phép codesign truy cập mà không cần prompt mật khẩu
      # thủ công (security set-key-partition-list) — pattern chuẩn Apple khuyến nghị cho CI.
      - name: Import signing certificate into temporary keychain
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$P12_BASE64" | base64 --decode -o "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/PeaceFlow_AppStore.mobileprovision

      - name: Create ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>vn.peaceflow.app</key>
              <string>PeaceFlow AppStore</string>
            </dict>
          </dict>
          </plist>
          PLIST

      # Cấu hình ký (CODE_SIGN_STYLE=Manual, DEVELOPMENT_TEAM, provisioning profile...) đã
      # được set thẳng trong project.pbxproj CHỈ cho target "App" — KHÔNG truyền qua dòng
      # lệnh ở đây, vì truyền qua CLI sẽ ép áp dụng lên toàn bộ graph build kể cả các Swift
      # Package phụ thuộc (vd AppAuth của Google Sign-In), mà các package đó không hỗ trợ
      # provisioning profile nên sẽ làm archive fail ("does not support provisioning profiles").
      - name: Archive signed app
        working-directory: frontend-vue/ios/App
        run: |
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination 'generic/platform=iOS'

      - name: Export signed .ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          mkdir -p dist-ipa
          cp "$RUNNER_TEMP"/export/*.ipa dist-ipa/PeaceFlow-signed.ipa

      - name: Upload signed .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: PeaceFlow-signed-ipa
          path: dist-ipa/PeaceFlow-signed.ipa
          retention-days: 14

      # Dọn keychain tạm sau khi xong, kể cả khi job fail giữa chừng — không để lại cert trên
      # runner (runner dùng xong sẽ bị huỷ hoàn toàn nên bước này chỉ là vệ sinh thêm).
      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
