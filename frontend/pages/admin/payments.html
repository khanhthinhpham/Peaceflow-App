<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác nhận thanh toán — Admin PeaceFlow</title>
    <link rel="icon" href="../../public/favicon.jpg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../public/css/style.css">
</head>
<body style="background:var(--cream);padding:28px 18px;">
    <div style="max-width:820px;margin:0 auto;">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap;">
            <div>
                <div style="font-size:0.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-light);">PeaceFlow Admin</div>
                <h1 style="margin:4px 0 0;font-size:1.6rem;">Xác nhận thanh toán</h1>
            </div>
            <button id="reloadBtn" class="btn-outline">↻ Tải lại</button>
        </div>

        <div class="paper-card" style="padding:14px 16px;margin-bottom:16px;font-size:0.85rem;color:var(--text-secondary);line-height:1.55;">
            Đối chiếu sao kê tài khoản nền tảng. Khi thấy đúng <strong>số tiền</strong> + <strong>nội dung CK</strong>, bấm <strong>Xác nhận đã nhận tiền</strong> để chốt lịch. Nếu không thấy tiền, bấm <strong>Từ chối</strong>.
        </div>

        <div id="adminPaymentsList"></div>
    </div>

    <script type="module">
        import { apiClient } from '../../public/js/api-client.js';
        import { auth } from '../../public/js/auth.js';

        const listEl = document.getElementById('adminPaymentsList');

        function esc(v) {
            return String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function money(v) { return `${Number(v || 0).toLocaleString('vi-VN')}đ`; }
        function dt(v) {
            try {
                return new Intl.DateTimeFormat('vi-VN', { weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Bangkok' }).format(new Date(v));
            } catch (_e) { return v; }
        }
        const TYPE = { chat: 'Chat text', voice: 'Gọi thoại', video: 'Video call', inperson: 'Gặp trực tiếp' };

        async function load() {
            listEl.innerHTML = '<div class="paper-card" style="padding:20px;text-align:center;color:var(--text-secondary);">Đang tải...</div>';
            let rows = [];
            try {
                rows = await apiClient.get('/admin/bookings/pending-payment', { noCache: true });
            } catch (_e) {
                listEl.innerHTML = '<div class="paper-card" style="padding:20px;text-align:center;color:var(--coral);">Không tải được danh sách (cần quyền admin).</div>';
                return;
            }
            if (!Array.isArray(rows) || !rows.length) {
                listEl.innerHTML = '<div class="paper-card" style="padding:28px;text-align:center;color:var(--text-secondary);">✅ Không có thanh toán nào đang chờ xác nhận.</div>';
                return;
            }
            listEl.innerHTML = rows.map((b) => `
                <div class="paper-card" style="padding:16px 18px;margin-bottom:12px;">
                    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;">
                        <div>
                            <div style="font-weight:800;">${esc(b.client_name)} <span style="color:var(--text-light);font-weight:600;">→ ${esc(b.expert_name)}</span></div>
                            <div style="color:var(--text-secondary);font-size:0.85rem;margin-top:4px;">${esc(TYPE[b.session_type] || b.session_type)} · ${dt(b.starts_at)}</div>
                            ${b.notes ? `<div style="color:var(--text-secondary);font-size:0.82rem;margin-top:6px;">📝 ${esc(b.notes)}</div>` : ''}
                        </div>
                        <div style="text-align:right;min-width:160px;">
                            <div style="font-size:1.2rem;font-weight:800;color:var(--coral);">${money(b.amount)}</div>
                            <div style="font-size:0.82rem;color:var(--text-secondary);">Nội dung CK:</div>
                            <div style="font-weight:800;font-family:monospace;">${esc(b.content || '')}</div>
                        </div>
                    </div>
                    <div style="display:flex;gap:10px;margin-top:14px;justify-content:flex-end;">
                        <button class="btn-outline" data-reject="${b.id}">Từ chối</button>
                        <button class="btn-primary" data-confirm="${b.id}">✓ Xác nhận đã nhận tiền</button>
                    </div>
                </div>
            `).join('');

            listEl.querySelectorAll('[data-confirm]').forEach((btn) => {
                btn.addEventListener('click', () => act(`/admin/bookings/${btn.getAttribute('data-confirm')}/confirm-payment`, btn));
            });
            listEl.querySelectorAll('[data-reject]').forEach((btn) => {
                btn.addEventListener('click', () => {
                    if (window.confirm('Từ chối (không nhận được tiền) và huỷ đơn này?')) {
                        act(`/admin/bookings/${btn.getAttribute('data-reject')}/reject-payment`, btn);
                    }
                });
            });
        }

        async function act(url, btn) {
            btn.disabled = true;
            try {
                await apiClient.post(url, {});
                load();
            } catch (e) {
                alert(e.message || 'Thao tác thất bại.');
                btn.disabled = false;
            }
        }

        document.getElementById('reloadBtn').addEventListener('click', load);

        (async () => {
            const ok = await auth.waitForAuth();
            const user = auth.getUser();
            if (!ok || user?.role !== 'admin') {
                listEl.innerHTML = '<div class="paper-card" style="padding:28px;text-align:center;color:var(--coral);">Bạn cần đăng nhập bằng tài khoản quản trị (admin) để dùng trang này.</div>';
                return;
            }
            load();
        })();
    </script>
</body>
</html>
