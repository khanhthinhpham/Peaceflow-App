<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu — PeaceFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../public/css/style.css">
    <style>
        .auth-container { min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--cream) 0%,var(--mint-light) 100%); padding:20px; }
        .auth-card { width:100%; max-width:400px; padding:40px 30px; text-align:center; background:var(--warm-white); }
        .auth-logo { display:inline-flex; align-items:center; justify-content:center; width:56px; height:56px; background:var(--mint); border-radius:var(--radius-sm); border:2px solid var(--mint-dark); font-size:1.8rem; box-shadow:3px 3px 0px var(--mint-dark); margin-bottom:20px; }
        .auth-message { display:none; padding:12px 14px; border-radius:var(--radius-sm); font-size:0.9rem; margin-bottom:16px; border:1px solid transparent; }
        .auth-message.error { display:block; color:#8A2F2F; background:#FFE3E3; border-color:#FFB8B8; }
        .auth-message.success { display:block; color:var(--mint-dark); background:var(--mint-light); border-color:var(--mint); }
        .auth-links { margin-top:20px; font-size:0.85rem; color:var(--text-secondary); }
        .auth-links a { color:var(--mint-dark); font-weight:700; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="paper-card auth-card">
            <div class="auth-logo">🔑</div>
            <h1 style="font-size:1.4rem;margin-bottom:8px;">Đặt lại mật khẩu</h1>
            <p style="color:var(--text-secondary);font-size:0.9rem;margin-bottom:24px;">Tạo mật khẩu mới cho tài khoản của bạn.</p>

            <div id="msg" class="auth-message"></div>
            <div id="invalidToken" style="display:none;color:var(--coral-dark);text-align:center;">
                Link đặt lại mật khẩu không hợp lệ hoặc đã hết hạn.<br>
                <a href="forgot-password.html" style="color:var(--mint-dark);font-weight:700;">Yêu cầu link mới</a>
            </div>

            <form id="resetForm" style="text-align:left;">
                <div class="form-group">
                    <label class="form-label">Mật khẩu mới</label>
                    <input type="password" id="password" class="form-input" placeholder="Ít nhất 8 ký tự" required minlength="8" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label class="form-label">Xác nhận mật khẩu</label>
                    <input type="password" id="confirmPassword" class="form-input" placeholder="Nhập lại mật khẩu" required minlength="8" autocomplete="new-password">
                </div>
                <button type="submit" id="submitBtn" class="btn-primary" style="width:100%;font-size:1rem;padding:12px;margin-top:8px;">
                    Đặt lại mật khẩu
                </button>
            </form>
        </div>
    </div>
    <script type="module">
        import { apiClient } from '../public/js/api-client.js';

        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        if (!token) {
            document.getElementById('resetForm').style.display = 'none';
            document.getElementById('invalidToken').style.display = 'block';
        }

        const form = document.getElementById('resetForm');
        if (!token) return; // Không attach listener nếu không có token
        const btn = document.getElementById('submitBtn');
        const msg = document.getElementById('msg');

        function showMsg(text, type) {
            msg.textContent = text;
            msg.className = 'auth-message ' + type;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                showMsg('Mật khẩu xác nhận không khớp.', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Đang cập nhật...';
            try {
                await apiClient.post('/auth/reset-password', { token, password });
                showMsg('Mật khẩu đã được đặt lại thành công!', 'success');
                form.style.display = 'none';
                setTimeout(() => window.location.href = 'login.html', 2000);
            } catch (err) {
                if (err.message?.includes('hợp lệ') || err.message?.includes('hết hạn')) {
                    form.style.display = 'none';
                    document.getElementById('invalidToken').style.display = 'block';
                } else {
                    showMsg(err.message || 'Có lỗi xảy ra. Vui lòng thử lại.', 'error');
                }
            } finally {
                btn.disabled = false;
                btn.textContent = 'Đặt lại mật khẩu';
            }
        });
    </script>
</body>
</html>
