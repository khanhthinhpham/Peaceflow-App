<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../public/favicon.jpg" type="image/svg+xml">
    <title>Đăng Nhập — PeaceFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../public/css/style.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--cream) 0%, var(--mint-light) 100%);
            padding: 20px;
        }
        .auth-card {
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            text-align: center;
            background: var(--warm-white);
        }
        .auth-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            background: var(--mint);
            border-radius: var(--radius-sm);
            border: 2px solid var(--mint-dark);
            font-size: 1.8rem;
            box-shadow: 3px 3px 0px var(--mint-dark);
            margin-bottom: 20px;
        }
        .auth-title {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }
        .auth-subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        .auth-form {
            text-align: left;
        }
        .auth-links {
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .auth-links a {
            color: var(--mint-dark);
            font-weight: 700;
        }
        #loginError {
            display: none;
            color: var(--coral-dark);
            background: var(--coral-light);
            padding: 10px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            margin-bottom: 15px;
            border: 1px solid var(--coral);
        }
        #loginError.success {
            color: var(--mint-dark);
            background: var(--mint-light);
            border-color: var(--mint);
        }
        #loginError.error {
            color: var(--coral-dark);
            background: var(--coral-light);
            border-color: var(--coral);
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: var(--text-light);
            font-size: 0.85rem;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px dashed var(--kraft-light);
        }
        .divider:not(:empty)::before {
            margin-right: .5em;
        }
        .divider:not(:empty)::after {
            margin-left: .5em;
        }
        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 10px 12px;
            border: 2px solid var(--kraft-light);
            border-radius: 50px;
            background: white;
            color: var(--text-primary);
            font-family: 'Nunito', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-google:hover {
            background: var(--cream);
            border-color: var(--kraft);
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="paper-card auth-card">
            <div class="auth-logo">🌿</div>
            <h1 class="auth-title">Chào mừng trở lại</h1>
            <p class="auth-subtitle">Tiếp tục hành trình tìm kiếm sự bình yên của bạn.</p>

            <div id="loginError"></div>

            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-input" placeholder="Nhập email của bạn" required autocomplete="email">
                </div>
                <div class="form-group" style="margin-bottom: 20px;">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" id="password" class="form-input" placeholder="Nhập mật khẩu" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; font-size: 1rem; padding: 12px;">Đăng Nhập</button>
            </form>

            <div class="auth-links">
                Chưa có tài khoản? <a href="signup.html">Đăng ký ngay</a>
            </div>
            <div class="auth-links" style="margin-top: 10px;">
                <a href="index.html" style="color: var(--text-light); font-weight: normal;">&larr; Quay lại trang chủ</a>
            </div>
        </div>
    </div>
    <script type="module">
      import { auth } from '../public/js/auth.js';

      const form = document.getElementById('loginForm');
      const btn = document.querySelector('button[type="submit"]');
      const msg = document.getElementById('loginError');

      function showMessage(text, type = 'info') {
        msg.textContent = text;
        msg.className = 'auth-message ' + type;
        msg.style.display = text ? 'block' : 'none';
      }

      function getLoginErrorMessage(error) {
        const message = String(error?.message || '').trim();

        if (message === 'Account not found' || message === 'Không tìm thấy tài khoản.') {
          return 'Không tìm thấy tài khoản.';
        }

        if (message === 'Incorrect password' || message === 'Sai mật khẩu.') {
          return 'Sai mật khẩu.';
        }

        if (message === 'Account is inactive' || message === 'Tài khoản hiện đang bị vô hiệu hóa.') {
          return 'Tài khoản hiện đang bị vô hiệu hóa.';
        }

        if (message === 'Invalid email or password') {
          return 'Email hoặc mật khẩu không đúng.';
        }

        return message || 'Đăng nhập thất bại.';
      }

      function getPostLoginRedirect() {
        const target = sessionStorage.getItem('peaceflow_post_login_redirect');
        if (!target || target.includes('login.html')) return 'dashboard.html';
        return target;
      }

      function redirectAfterLogin() {
        const target = getPostLoginRedirect();
        sessionStorage.removeItem('peaceflow_post_login_redirect');
        sessionStorage.removeItem('peaceflow_last_login_redirect_at');
        window.location.replace(target);
      }

      // Nếu đã login thì vào dashboard luôn
      (async () => {
        const authenticated = await auth.waitForAuth();
        if (authenticated) redirectAfterLogin();
      })();

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        showMessage('');

        const email = document.getElementById('email').value.trim().toLowerCase();
        const password = document.getElementById('password').value;

        if (!email) {
          showMessage('Vui lòng nhập email.', 'error');
          return;
        }

        if (!password) {
          showMessage('Vui lòng nhập mật khẩu.', 'error');
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Đang đăng nhập...';

        try {
          await auth.login(email, password);

          showMessage('Đăng nhập thành công!', 'success');
          setTimeout(() => redirectAfterLogin(), 700);
        } catch (err) {
          showMessage(getLoginErrorMessage(err), 'error');
        } finally {
          btn.disabled = false;
          btn.textContent = 'Đăng Nhập';
        }
      });
    </script>
</body>
</html>
