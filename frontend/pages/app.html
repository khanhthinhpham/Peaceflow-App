<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../public/favicon.svg" type="image/svg+xml">
    <title>PeaceFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #FFF8F0;
            --warm-white: #FFFDF7;
            --kraft: #D4A574;
            --kraft-light: #E8CBA7;
            --kraft-dark: #B8895A;
            --mint: #A8D5BA;
            --mint-light: #C5E8D2;
            --mint-dark: #7BBF95;
            --peach: #FFCBA4;
            --peach-light: #FFE0C4;
            --peach-dark: #E8A876;
            --lavender-light: #DDD1EB;
            --coral: #FF8B8B;
            --text-primary: #4A3728;
            --text-secondary: #7A6555;
            --text-light: #A89585;
            --border-radius: 16px;
            --border-radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --sidebar-width: 240px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--cream);
            color: var(--text-primary);
            overflow: hidden;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: var(--sidebar-width);
            background: var(--warm-white);
            border-right: 2px solid var(--kraft-light);
            z-index: 200;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            box-shadow: 2px 0 10px rgba(74, 55, 40, 0.05);
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 20px 20px;
            border-bottom: 2px dashed var(--kraft-light);
            margin-bottom: 16px;
            text-decoration: none;
        }

        .sidebar-logo .logo-icon {
            width: 38px;
            height: 38px;
            background: var(--mint);
            border-radius: 10px;
            border: 2px solid var(--mint-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            box-shadow: 2px 2px 0 var(--mint-dark);
        }

        .sidebar-logo .logo-text {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .sidebar-logo .logo-text span {
            color: var(--mint-dark);
        }

        .sidebar-nav {
            flex: 1;
            padding: 0 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-y: auto;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: var(--border-radius-sm);
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.88rem;
            transition: var(--transition);
        }

        .nav-item:hover {
            background: var(--mint-light);
            color: var(--text-primary);
        }

        .nav-item.active {
            background: var(--mint-light);
            color: var(--text-primary);
            border: 1.5px solid var(--mint);
        }

        .nav-item .ni {
            font-size: 1.1rem;
            width: 22px;
            text-align: center;
        }

        .nav-section-label {
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 10px 12px 4px;
        }

        .sidebar-bottom {
            padding: 12px;
            border-top: 2px dashed var(--kraft-light);
            margin-top: auto;
        }

        .user-card-mini {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: var(--cream);
            border-radius: var(--border-radius-sm);
            border: 1.5px solid var(--kraft-light);
        }

        .user-avatar-mini {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--lavender-light);
            border: 2px solid var(--kraft);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .user-info-mini .user-name {
            font-size: 0.85rem;
            font-weight: 700;
        }

        .user-info-mini .user-level {
            font-size: 0.72rem;
            color: var(--text-light);
        }

        .emergency-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            background: rgba(255, 139, 139, 0.1);
            border: 1.5px solid var(--coral);
            border-radius: var(--border-radius-sm);
            color: var(--coral);
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: var(--transition);
            text-decoration: none;
        }

        .mobile-topbar {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--warm-white);
            border-bottom: 2px solid var(--kraft-light);
            z-index: 300;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }

        .mobile-menu-btn {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: var(--text-primary);
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(74, 55, 40, 0.3);
            z-index: 150;
        }

        .shell-host {
            margin-left: var(--sidebar-width);
            width: calc(100vw - var(--sidebar-width));
            min-height: 100vh;
            position: relative;
            background: var(--warm-white);
        }

        .shell-host.is-loading::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 253, 247, 0.55);
            pointer-events: none;
        }

        .shell-loading {
            position: absolute;
            top: 18px;
            right: 18px;
            z-index: 10;
            padding: 8px 12px;
            border-radius: 999px;
            border: 1.5px solid var(--kraft-light);
            background: var(--warm-white);
            color: var(--text-secondary);
            font-size: 0.78rem;
            font-weight: 700;
            box-shadow: 0 8px 24px rgba(74, 55, 40, 0.08);
        }

        @media (max-width: 900px) {
            :root {
                --sidebar-width: 0px;
            }

            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar-overlay.open {
                display: block;
            }

            .mobile-topbar {
                display: flex;
            }

            .shell-host {
                margin-left: 0;
                width: 100vw;
                margin-top: 60px;
                min-height: calc(100vh - 60px);
            }
        }
    </style>
</head>
<body>
    <div id="sharedSidebarOverlayMount"></div>
    <div id="sharedMobileTopbarMount"></div>
    <div id="sharedSidebarMount"></div>
    <div id="spaPageHost" class="shell-host is-loading">
        <div id="spaPageLoading" class="shell-loading">Đang tải trang...</div>
    </div>

    <script src="../public/components/sidebar.js"></script>
    <script src="../public/js/user-sync.js"></script>
    <script src="../public/js/app.js"></script>
    <script type="module" src="../public/js/notifications.js"></script>
    <script>
        (function redirectShellToRealPage() {
            const parsed = new URL(window.location.href);
            const page = parsed.searchParams.get('page');
            const target = page && page.trim() ? page : 'dashboard.html';
            window.location.replace(target);
        })();
    </script>
</body>
</html>
