services:
  db:
    image: postgres:16-alpine
    container_name: peaceflow_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123 # Thay bằng mật khẩu trong .env của bạn
      POSTGRES_DB: peaceflow
    ports:
      - "5432:5432"
    volumes:
      # Đây là phần QUAN TRỌNG nhất để kiểm soát data
      - ./postgres_data:/var/lib/postgresql/data
  
  pgadmin:
    image: dpage/pgadmin4
    container_name: peaceflow_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@peaceflow.com # Tài khoản đăng nhập web
      PGADMIN_DEFAULT_PASSWORD: admin # Mật khẩu đăng nhập web
    ports:
      - "5050:80" # Ánh xạ ra cổng 5050 trên máy bạn
    depends_on:
      - db

volumes:
  postgres_data: