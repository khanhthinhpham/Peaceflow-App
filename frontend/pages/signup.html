<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../public/favicon.jpg" type="image/svg+xml">
    <title>Đăng Ký — PeaceFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Patrick+Hand&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../public/css/style.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--cream) 0%, var(--peach-light) 100%);
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 520px;
            padding: 40px 30px;
            text-align: center;
            background: var(--warm-white);
        }

        .auth-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            background: var(--peach);
            border-radius: var(--radius-sm);
            border: 2px solid var(--peach-dark);
            font-size: 1.8rem;
            box-shadow: 3px 3px 0 var(--peach-dark);
            margin-bottom: 20px;
        }

        .auth-title {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .auth-form {
            text-align: left;
        }

        .auth-links {
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .auth-links a {
            color: var(--peach-dark);
            font-weight: 700;
            text-decoration: none;
        }

        .auth-links a:hover {
            text-decoration: underline;
        }

        .auth-message {
            display: none;
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            margin-bottom: 16px;
            border: 1px solid transparent;
            line-height: 1.5;
        }

        .auth-message.error {
            display: block;
            color: #8A2F2F;
            background: #FFE3E3;
            border-color: #FFB8B8;
        }

        .auth-message.success {
            display: block;
            color: var(--mint-dark);
            background: var(--mint-light);
            border-color: var(--mint);
        }

        .auth-message.info {
            display: block;
            color: #6B5B2A;
            background: #FFF4CC;
            border-color: #FFE08A;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 0.88rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .checkbox-group input {
            margin-top: 3px;
            accent-color: var(--peach-dark);
        }

        .checkbox-group a {
            color: var(--peach-dark);
            font-weight: 700;
            text-decoration: none;
        }

        .checkbox-group a:hover {
            text-decoration: underline;
        }

        .btn-primary[disabled] {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .field-hint {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: 6px;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: var(--text-light);
            font-size: 0.85rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px dashed var(--kraft-light);
        }

        .divider:not(:empty)::before {
            margin-right: .5em;
        }

        .divider:not(:empty)::after {
            margin-left: .5em;
        }

        .account-toggle {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 18px;
        }

        .toggle-chip {
            border: 2px solid var(--kraft-light);
            border-radius: 999px;
            background: #fff;
            padding: 10px 14px;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
            color: var(--text-secondary);
            transition: var(--transition);
        }

        .toggle-chip.active {
            background: var(--peach);
            border-color: var(--peach-dark);
            color: var(--text-primary);
            box-shadow: 2px 2px 0 var(--peach-dark);
        }
    </style>
</head>

<body>

    <div class="auth-container">
        <div class="paper-card auth-card" style="border-color: var(--peach);">
            <div class="auth-logo">🌸</div>
            <h1 class="auth-title">Bắt đầu hành trình</h1>
            <p class="auth-subtitle">
                Tạo tài khoản để lưu giữ nhật ký, tiến trình hồi phục
                và trải nghiệm cá nhân hóa cùng PeaceFlow.
            </p>

            <div id="signupMessage" class="auth-message"></div>

            <form class="auth-form" id="signupForm">
                <div class="account-toggle" aria-label="Loại tài khoản">
                    <button type="button" class="toggle-chip active" id="signupModeUser">Người dùng</button>
                    <button type="button" class="toggle-chip" id="signupModeExpert">Chuyên gia</button>
                </div>

                <div class="form-group">
                    <label class="form-label" for="name">Tên hiển thị</label>
                    <input type="text" id="name" class="form-input" placeholder="Bạn muốn được gọi là gì?" required
                        maxlength="80" autocomplete="name">
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" class="form-input" placeholder="Nhập email của bạn" required
                        autocomplete="email">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Mật khẩu</label>
                    <input type="password" id="password" class="form-input" placeholder="Tạo mật khẩu (ít nhất 8 ký tự)"
                        required minlength="8" autocomplete="new-password">
                    <div class="field-hint">
                        Nên dùng ít nhất 8 ký tự, bao gồm chữ và số để tăng độ an toàn.
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Xác nhận mật khẩu</label>
                    <input type="password" id="confirmPassword" class="form-input" placeholder="Nhập lại mật khẩu"
                        required minlength="8" autocomplete="new-password">
                </div>

                <label class="checkbox-group">
                    <input type="checkbox" id="agreeTerms" required>
                    <span>
                        Tôi đồng ý với
                        <a href="terms.html">Điều khoản sử dụng</a>
                        và
                        <a href="privacy.html">Chính sách quyền riêng tư</a>
                        của PeaceFlow.
                    </span>
                </label>

                <button type="submit" id="signupBtn" class="btn-primary"
                    style="width: 100%; font-size: 1rem; padding: 12px; background: var(--peach); border-color: var(--peach-dark); box-shadow: 2px 2px 0 var(--peach-dark);">
                    Đăng Ký
                </button>
            </form>

            <div class="divider" id="signupDivider" style="margin-top:20px;">hoặc</div>

            <div id="btnGoogleSignup" style="display:flex;justify-content:center;margin-bottom:4px;"></div>

            <div class="auth-links">
                Đã có tài khoản? <a href="login.html">Đăng nhập</a>
            </div>
        </div>
    </div>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module">
        import { auth } from '../public/js/auth.js';
        import { apiClient } from '../public/js/api-client.js';

        const GOOGLE_CLIENT_ID = '287402483358-uiec013q9obn1m8j82ejhkdmuoi3ku6v.apps.googleusercontent.com';

        const backendSignupForm = document.getElementById('signupForm');
        const backendSignupBtn = document.getElementById('signupBtn');
        const backendSignupMessage = document.getElementById('signupMessage');
        const signupModeUser = document.getElementById('signupModeUser');
        const signupModeExpert = document.getElementById('signupModeExpert');
        const signupDivider = document.getElementById('signupDivider');
        const googleSignup = document.getElementById('btnGoogleSignup');
        let signupMode = 'user';

        function showBackendMessage(message, type = 'info') {
            backendSignupMessage.className = message ? `auth-message ${type}` : 'auth-message';
            backendSignupMessage.textContent = message || '';
        }

        function setSignupMode(mode) {
            signupMode = mode === 'expert' ? 'expert' : 'user';
            const isExpert = signupMode === 'expert';
            signupModeUser.classList.toggle('active', !isExpert);
            signupModeExpert.classList.toggle('active', isExpert);
            if (isExpert) {
                signupDivider.style.display = 'none';
                googleSignup.style.display = 'none';
                showBackendMessage('Chuyên gia sẽ xác minh email trước. Sau khi đăng nhập, bạn sẽ được chuyển sang bước nộp hồ sơ và file bằng cấp.', 'info');
            } else {
                signupDivider.style.display = '';
                googleSignup.style.display = '';
                showBackendMessage('');
            }
        }

        function getSignupErrorMessage(error) {
            const message = String(error?.message || '').trim();

            if (!message) return 'Đăng ký thất bại.';
            if (message === 'Email already registered' || message === 'Email đã được đăng ký.') {
                return 'Email đã được đăng ký.';
            }
            if (
                message === 'Failed to fetch' ||
                message === 'Load failed' ||
                message.includes('NetworkError') ||
                message === 'Không kết nối được máy chủ.' ||
                message === 'Mất kết nối máy chủ.'
            ) {
                return 'Không kết nối được máy chủ.';
            }
            if (message === 'Invalid email') return 'Email chưa hợp lệ.';
            return message;
        }

        async function handleGoogleCredential(response) {
            showBackendMessage('Đang xác thực với Google...', 'info');
            try {
                const data = await apiClient.post('/auth/google', { id_token: response.credential });
                auth.setSession(data);
                showBackendMessage('Đăng ký thành công! Đang chuyển hướng...', 'success');
                setTimeout(() => window.location.href = 'dashboard.html', 700);
            } catch (err) {
                showBackendMessage(err.message || 'Đăng nhập Google thất bại.', 'error');
            }
        }

        window.handleGoogleCredential = handleGoogleCredential;

        window.addEventListener('load', () => {
            if (window.google?.accounts) {
                google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: handleGoogleCredential,
                    auto_select: false,
                    cancel_on_tap_outside: true
                });
                const width = Math.min(googleSignup?.offsetWidth || 360, 360);
                google.accounts.id.renderButton(googleSignup, {
                    theme: 'outline',
                    size: 'large',
                    width,
                    text: 'signup_with',
                    shape: 'pill',
                    locale: 'vi'
                });
            }
        });

        signupModeUser.addEventListener('click', () => setSignupMode('user'));
        signupModeExpert.addEventListener('click', () => setSignupMode('expert'));

        backendSignupForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            event.stopImmediatePropagation();

            const fullName = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const agreed = document.getElementById('agreeTerms').checked;
            const isExpert = signupMode === 'expert';

            if (!fullName || fullName.length < 2) {
                showBackendMessage('Vui lòng nhập tên hiển thị ít nhất 2 ký tự.', 'error');
                return;
            }
            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showBackendMessage('Email chưa hợp lệ.', 'error');
                return;
            }
            if (!password || password.length < 8) {
                showBackendMessage('Mật khẩu cần có ít nhất 8 ký tự.', 'error');
                return;
            }
            if (password !== confirmPassword) {
                showBackendMessage('Mật khẩu xác nhận không khớp.', 'error');
                return;
            }
            if (!agreed) {
                showBackendMessage('Bạn cần đồng ý điều khoản để tiếp tục.', 'error');
                return;
            }

            backendSignupBtn.disabled = true;
            backendSignupBtn.textContent = 'Đang tạo tài khoản...';

            try {
                if (isExpert) {
                    await auth.signupExpert({
                        email,
                        password,
                        full_name: fullName,
                        display_name: fullName,
                        consent_privacy: true,
                        consent_terms: true
                    });
                } else {
                    await auth.signup(email, password, fullName, {
                        consent_privacy: true,
                        consent_terms: true,
                        consent_sensitive_data: false
                    });
                }

                auth.clearSession();
                localStorage.removeItem('peaceflow_onboarding_done');

                backendSignupForm.style.display = 'none';
                signupDivider?.remove();
                googleSignup?.remove();
                showBackendMessage(
                    isExpert
                        ? `✅ Tài khoản chuyên gia đã được tạo cho ${email}. Hãy xác minh email trước, rồi đăng nhập để gửi hồ sơ và file bằng cấp.`
                        : `✅ Đăng ký thành công! Chúng tôi đã gửi email xác nhận đến ${email}. Vui lòng kiểm tra hộp thư và nhấn vào liên kết để kích hoạt tài khoản.`,
                    'success'
                );
            } catch (error) {
                showBackendMessage(getSignupErrorMessage(error), 'error');
            } finally {
                backendSignupBtn.disabled = false;
                backendSignupBtn.textContent = 'Đăng Ký';
            }
        }, true);

        setSignupMode('user');
    </script>

    <script src="../public/js/app.js"></script>
</body>

</html>
