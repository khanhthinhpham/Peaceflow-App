# Build app iOS cho THIẾT BỊ THẬT, CHƯA KÝ, đóng gói thành .ipa để tải về rồi tự ký bằng
# Apple ID cá nhân (miễn phí) qua Sideloadly trên Windows — không cần Mac, không cần tài
# khoản Apple Developer Program ($99/năm) ở bước này. Chạy thủ công (workflow_dispatch).
#
# LƯU Ý: app ký bằng Apple ID miễn phí chỉ dùng được 7 ngày rồi phải cài lại (giới hạn của
# Apple, không phải lỗi). Muốn lên App Store/TestFlight thì mới cần Developer Program.
name: Build iOS (unsigned .ipa for sideload)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-vue/package-lock.json

      - name: Install frontend-vue dependencies
        working-directory: frontend-vue
        run: npm ci

      - name: Build web assets + sync Capacitor iOS project
        working-directory: frontend-vue
        run: npm run cap:sync

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build for real iOS device (unsigned)
        working-directory: frontend-vue/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned .ipa
        working-directory: frontend-vue/ios/App
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r PeaceFlow-unsigned.ipa Payload

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: PeaceFlow-unsigned-ipa
          path: frontend-vue/ios/App/PeaceFlow-unsigned.ipa
          retention-days: 14
