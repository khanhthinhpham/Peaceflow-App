<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../public/favicon.jpg" type="image/svg+xml">
    <title>Đăng Nhập — PeaceFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../public/css/style.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--cream) 0%, var(--mint-light) 100%);
            padding: 20px;
        }
        .auth-card {
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            text-align: center;
            background: var(--warm-white);
        }
        .auth-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            background: var(--mint);
            border-radius: var(--radius-sm);
            border: 2px solid var(--mint-dark);
            font-size: 1.8rem;
            box-shadow: 3px 3px 0 var(--mint-dark);
            margin-bottom: 20px;
        }
        .auth-title {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }
        .auth-subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        .auth-form {
            text-align: left;
        }
        .auth-links {
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .auth-links a {
            color: var(--mint-dark);
            font-weight: 700;
        }
        .auth-message {
            display: none;
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.88rem;
            margin-bottom: 15px;
            border: 1px solid transparent;
            line-height: 1.5;
        }
        .auth-message.error   { display:block; color:#8A2F2F; background:#FFE3E3; border-color:#FFB8B8; }
        .auth-message.success { display:block; color:var(--mint-dark); background:var(--mint-light); border-color:var(--mint); }
        .auth-message.info    { display:block; color:#6B5B2A; background:#FFF4CC; border-color:#FFE08A; }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: var(--text-light);
            font-size: 0.85rem;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px dashed var(--kraft-light);
        }
        .divider:not(:empty)::before { margin-right: .5em; }
        .divider:not(:empty)::after { margin-left: .5em; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="paper-card auth-card">
            <div class="auth-logo">🌿</div>
            <h1 class="auth-title">Chào mừng trở lại</h1>
            <p class="auth-subtitle">Tiếp tục hành trình tìm kiếm sự bình yên của bạn.</p>

            <div id="loginError"></div>

            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-input" placeholder="Nhập email của bạn" required autocomplete="email">
                </div>
                <div class="form-group" style="margin-bottom: 8px;">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" id="password" class="form-input" placeholder="Nhập mật khẩu" required autocomplete="current-password">
                </div>
                <div style="text-align:right;margin-bottom:16px;">
                    <a href="forgot-password.html" style="font-size:0.82rem;color:var(--text-light);">Quên mật khẩu?</a>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; font-size: 1rem; padding: 12px;">Đăng Nhập</button>
            </form>

            <div class="divider" style="margin-top:20px;">hoặc</div>

            <div id="btnGoogleLogin" style="display:flex;justify-content:center;margin-bottom:4px;"></div>

            <div class="auth-links">
                Chưa có tài khoản? <a href="signup.html">Đăng ký ngay</a>
            </div>
            <div class="auth-links" style="margin-top: 10px;">
                <a href="index.html" style="color: var(--text-light); font-weight: normal;">&larr; Quay lại trang chủ</a>
            </div>
        </div>
    </div>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module">
      import { auth } from '../public/js/auth.js';
      import { apiClient } from '../public/js/api-client.js';

      const form = document.getElementById('loginForm');
      const btn = document.querySelector('button[type="submit"]');
      const msg = document.getElementById('loginError');
      const params = new URLSearchParams(window.location.search);

      function showMessage(text, type = 'info') {
        msg.textContent = text;
        msg.className = 'auth-message ' + type;
        msg.style.display = text ? 'block' : 'none';
      }

      function getLoginErrorMessage(error) {
        const message = String(error?.message || '').trim();

        if (message === 'Account not found' || message === 'Không tìm thấy tài khoản.') {
          return 'Không tìm thấy tài khoản.';
        }
        if (message === 'Incorrect password' || message === 'Sai mật khẩu.') {
          return 'Sai mật khẩu.';
        }
        if (message === 'Account is inactive' || message === 'Tài khoản hiện đang bị vô hiệu hóa.') {
          return 'Tài khoản hiện đang bị vô hiệu hóa.';
        }
        if (message === 'EMAIL_NOT_VERIFIED') {
          return '__EMAIL_NOT_VERIFIED__';
        }
        if (message === 'Hồ sơ chuyên gia của bạn đang chờ admin duyệt.') {
          return '__EXPERT_PENDING__';
        }
        if (message === 'Invalid email or password') {
          return 'Email hoặc mật khẩu không đúng.';
        }

        return message || 'Đăng nhập thất bại.';
      }

      function getPostLoginRedirect() {
        const target = sessionStorage.getItem('peaceflow_post_login_redirect');
        if (!target || target.includes('login.html')) return 'dashboard.html';
        return target;
      }

      async function redirectAfterLogin() {
        sessionStorage.removeItem('peaceflow_post_login_redirect');
        sessionStorage.removeItem('peaceflow_last_login_redirect_at');

        const user = auth.getUser();
        if (user?.role === 'expert') {
          try {
            const expertState = await auth.getMyExpertApplication();
            // Đã được duyệt (có profile) → vào khu chuyên gia.
            if (expertState?.has_expert_profile || expertState?.application?.status === 'approved') {
              window.location.replace('expert/app.html?page=dashboard.html');
              return;
            }
            // Chưa duyệt → vào app user bình thường (tab "Quản lý chuyên gia" ở sidebar
            // sẽ dẫn tới màn nộp hồ sơ / chờ duyệt). Bỏ qua, để chạy tiếp luồng user.
          } catch (e) {
            console.error('Expert application check failed:', e.message);
          }
        }

        const onboardingDone = localStorage.getItem('peaceflow_onboarding_done');
        if (onboardingDone) {
          window.location.replace(getPostLoginRedirect());
          return;
        }

        try {
          const res = await apiClient.get('/profile');
          const hasOnboarded = res?.onboarding_answers != null;
          if (hasOnboarded) {
            localStorage.setItem('peaceflow_onboarding_done', '1');
            window.location.replace(getPostLoginRedirect());
            return;
          }
        } catch (e) {
          console.error('Profile check failed:', e.message);
          window.location.replace(getPostLoginRedirect());
          return;
        }

        window.location.replace('onboarding.html');
      }

      if (params.get('verified') === '1') {
        showMessage('Email đã được xác minh. Bạn có thể đăng nhập ngay.', 'success');
      }

      (async () => {
        const authenticated = await auth.waitForAuth();
        if (authenticated) redirectAfterLogin();
      })();

      const GOOGLE_CLIENT_ID = '287402483358-uiec013q9obn1m8j82ejhkdmuoi3ku6v.apps.googleusercontent.com';

      async function handleGoogleCredential(response) {
        showMessage('Đang xác thực với Google...', 'info');
        try {
          const data = await apiClient.post('/auth/google', { id_token: response.credential });
          auth.setSession(data);
          showMessage('Đăng nhập thành công!', 'success');
          setTimeout(() => redirectAfterLogin(), 700);
        } catch (err) {
          showMessage(err.message || 'Đăng nhập Google thất bại.', 'error');
        }
      }

      window.handleGoogleCredential = handleGoogleCredential;

      window.addEventListener('load', () => {
        if (window.google?.accounts) {
          google.accounts.id.initialize({
            client_id: GOOGLE_CLIENT_ID,
            callback: handleGoogleCredential,
            auto_select: false,
            cancel_on_tap_outside: true
          });
          const container = document.getElementById('btnGoogleLogin');
          const width = Math.min(container?.offsetWidth || 360, 360);
          google.accounts.id.renderButton(container, {
            theme: 'outline',
            size: 'large',
            width,
            text: 'signin_with',
            shape: 'pill',
            locale: 'vi'
          });
        }
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        showMessage('');

        const email = document.getElementById('email').value.trim().toLowerCase();
        const password = document.getElementById('password').value;

        if (!email) {
          showMessage('Vui lòng nhập email.', 'error');
          return;
        }

        if (!password) {
          showMessage('Vui lòng nhập mật khẩu.', 'error');
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Đang đăng nhập...';

        try {
          await auth.login(email, password);
          showMessage('Đăng nhập thành công!', 'success');
          setTimeout(() => redirectAfterLogin(), 700);
        } catch (err) {
          const errMsg = getLoginErrorMessage(err);
          if (errMsg === '__EMAIL_NOT_VERIFIED__') {
            msg.innerHTML = `
              📧 Email chưa được xác nhận.<br>
              <span style="font-size:0.85rem;">Kiểm tra hộp thư của bạn và nhấn vào liên kết xác nhận.
              <a href="#" id="resendVerify" style="color:var(--mint-dark);font-weight:700;">Gửi lại email</a></span>
            `;
            msg.className = 'auth-message info';
            msg.style.display = 'block';
            document.getElementById('resendVerify')?.addEventListener('click', async (e) => {
              e.preventDefault();
              try {
                await apiClient.post('/auth/resend-verification', { email });
                document.getElementById('resendVerify').textContent = 'Đã gửi!';
              } catch (_) {}
            });
          } else if (errMsg === '__EXPERT_PENDING__') {
            showMessage('Hồ sơ chuyên gia của bạn đang chờ admin duyệt. Vui lòng kiểm tra email để nhận thông báo khi hồ sơ được chấp thuận.', 'info');
          } else {
            showMessage(errMsg, 'error');
          }
        } finally {
          btn.disabled = false;
          btn.textContent = 'Đăng Nhập';
        }
      });
    </script>
</body>
</html>
