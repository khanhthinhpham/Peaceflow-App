<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu — PeaceFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../public/css/style.css">
    <style>
        .auth-container { min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--cream) 0%,var(--mint-light) 100%); padding:20px; }
        .auth-card { width:100%; max-width:400px; padding:40px 30px; text-align:center; background:var(--warm-white); }
        .auth-logo { display:inline-flex; align-items:center; justify-content:center; width:56px; height:56px; background:var(--mint); border-radius:var(--radius-sm); border:2px solid var(--mint-dark); font-size:1.8rem; box-shadow:3px 3px 0px var(--mint-dark); margin-bottom:20px; }
        .auth-message { display:none; padding:12px 14px; border-radius:var(--radius-sm); font-size:0.9rem; margin-bottom:16px; border:1px solid transparent; }
        .auth-message.error { display:block; color:#8A2F2F; background:#FFE3E3; border-color:#FFB8B8; }
        .auth-message.success { display:block; color:var(--mint-dark); background:var(--mint-light); border-color:var(--mint); }
        .auth-links { margin-top:20px; font-size:0.85rem; color:var(--text-secondary); }
        .auth-links a { color:var(--mint-dark); font-weight:700; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="paper-card auth-card">
            <div class="auth-logo">🔐</div>
            <h1 style="font-size:1.4rem;margin-bottom:8px;">Quên mật khẩu?</h1>
            <p style="color:var(--text-secondary);font-size:0.9rem;margin-bottom:24px;">Nhập email và chúng tôi sẽ gửi link đặt lại mật khẩu.</p>

            <div id="msg" class="auth-message"></div>

            <form id="forgotForm" style="text-align:left;">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-input" placeholder="Nhập email của bạn" required autocomplete="email">
                </div>
                <button type="submit" id="submitBtn" class="btn-primary" style="width:100%;font-size:1rem;padding:12px;margin-top:8px;">
                    Gửi link đặt lại
                </button>
            </form>

            <div class="auth-links">
                <a href="login.html">← Quay lại đăng nhập</a>
            </div>
        </div>
    </div>
    <script type="module">
        import { apiClient } from '../public/js/api-client.js';

        const form = document.getElementById('forgotForm');
        const btn = document.getElementById('submitBtn');
        const msg = document.getElementById('msg');

        function showMsg(text, type) {
            msg.textContent = text;
            msg.className = 'auth-message ' + type;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim().toLowerCase();
            btn.disabled = true;
            btn.textContent = 'Đang gửi...';
            try {
                await apiClient.post('/auth/forgot-password', { email });
                showMsg('Nếu email tồn tại, bạn sẽ nhận được link đặt lại mật khẩu trong vài phút.', 'success');
                form.style.display = 'none';
            } catch (err) {
                showMsg(err.message || 'Có lỗi xảy ra. Vui lòng thử lại.', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Gửi link đặt lại';
            }
        });
    </script>
</body>
</html>
