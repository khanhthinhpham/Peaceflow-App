# Build thử app iOS (chưa ký) trên macOS runner của GitHub Actions — dùng để xác nhận
# project Capacitor sinh ra compile sạch mà không cần máy Mac thật. Chạy thủ công
# (workflow_dispatch) vì chỉ cần khi thay đổi liên quan tới mobile, không chạy mỗi lần push.
#
# Đây CHƯA PHẢI bước build bản release để nộp App Store — bản đó cần thêm chứng chỉ ký
# (Distribution certificate + provisioning profile) từ Apple Developer Program, sẽ bổ sung
# riêng khi đã có tài khoản.
name: Build iOS (unsigned, simulator)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-vue/package-lock.json

      - name: Install frontend-vue dependencies
        working-directory: frontend-vue
        run: npm ci

      - name: Build web assets + sync Capacitor iOS project
        working-directory: frontend-vue
        run: npm run cap:sync

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build for iOS Simulator (no signing required)
        working-directory: frontend-vue/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
