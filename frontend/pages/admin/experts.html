<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        if (!window.location.pathname.endsWith('/app.html')) {
            window.location.replace('app.html?page=' + window.location.pathname.split('/').pop());
        }
    </script>
    <title>Chuyên gia - Quản trị PeaceFlow</title>
    <link rel="stylesheet" href="../../public/css/style.css">
    <link rel="stylesheet" href="../../public/css/admin/admin.css">
</head>
<body class="admin-body">
    <main class="admin-main">
        <div class="admin-page-head" style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;">
            <div>
                <p class="admin-page-kicker">PeaceFlow Admin</p>
                <h1 class="admin-page-title">Chuyên gia</h1>
                <p class="admin-page-sub">Xét duyệt hồ sơ đăng ký & quản lý đội ngũ chuyên gia đang hoạt động.</p>
            </div>
            <button id="reloadBtn" class="btn-outline" type="button">
                <svg class="adm-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M20 11a8 8 0 1 0 2 5.3"></path>
                    <path d="M20 7v4h-4"></path>
                </svg>
                Tải lại
            </button>
        </div>

        <div class="admin-tabs" id="expertsModeTabs">
            <button type="button" class="admin-tab active" data-mode="applications">Hồ sơ đăng ký</button>
            <button type="button" class="admin-tab" data-mode="experts">Danh sách chuyên gia</button>
        </div>

        <!-- Hồ sơ đăng ký -->
        <div id="applicationsView">
            <div class="admin-tabs" id="adminApplicationsTabs">
                <button type="button" class="admin-tab active" data-status="pending">Chờ duyệt</button>
                <button type="button" class="admin-tab" data-status="approved">Đã duyệt</button>
                <button type="button" class="admin-tab" data-status="rejected">Từ chối</button>
                <button type="button" class="admin-tab" data-status="all">Tất cả</button>
            </div>
            <div style="display:flex;justify-content:flex-end;margin-bottom:10px;">
                <select id="appPageSize" class="admin-input" aria-label="Số hồ sơ mỗi trang" title="Số hồ sơ mỗi trang" style="max-width:130px;">
                    <option value="10" selected>10 / trang</option>
                    <option value="25">25 / trang</option>
                    <option value="50">50 / trang</option>
                    <option value="100">100 / trang</option>
                </select>
            </div>
            <div id="adminApplicationsMeta" style="font-size:.82rem;color:var(--text-light);margin-bottom:10px;"></div>
            <div id="adminApplicationsList"></div>
            <div id="adminApplicationsPager" class="admin-pager"></div>
        </div>

        <!-- Danh sách chuyên gia -->
        <div id="expertsView" style="display:none;">
            <div class="admin-card" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
                <input id="expertSearch" type="search" placeholder="Tìm theo tên, mã hoặc email..." class="admin-input" style="flex:1;min-width:220px;">
                <button id="expertSearchBtn" type="button" class="btn-primary">Tìm</button>
                <select id="expertPageSize" class="admin-input" aria-label="Số chuyên gia mỗi trang" title="Số chuyên gia mỗi trang" style="max-width:130px;">
                    <option value="10" selected>10 / trang</option>
                    <option value="25">25 / trang</option>
                    <option value="50">50 / trang</option>
                    <option value="100">100 / trang</option>
                </select>
            </div>
            <div class="admin-tabs" id="expertActiveTabs">
                <button type="button" class="admin-tab active" data-active="">Tất cả</button>
                <button type="button" class="admin-tab" data-active="true">Đang hoạt động</button>
                <button type="button" class="admin-tab" data-active="false">Đã tắt</button>
            </div>
            <div id="adminExpertsMeta" style="font-size:.82rem;color:var(--text-light);margin-bottom:10px;"></div>
            <div id="adminExpertsList"></div>
            <div id="adminExpertsPager" class="admin-pager"></div>
        </div>
    </main>
    <script type="module" src="../../public/js/admin/experts-page.js"></script>
</body>
</html>
